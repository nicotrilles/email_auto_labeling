
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail Auto-Labeler</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>

    <div class="container">

        <header class="header">
            <div>
                <h1>Gmail Auto-Labeler</h1>
                <p>Keep your inbox organized automatically.</p>
            </div>
        </header>

        <button id="addRuleBtn" class="primary-btn">
            + Create New Rule
        </button>

        <section class="rules-section">
            <h2>Your Rules</h2>
            <div id="rulesContainer"></div>
        </section>

        <section id="ruleForm" class="form-section" style="display: none;">

            <h2 id="formTitle">New Rule</h2>

            <div class="form-group">
                <label for="sender">Sender contains</label>
                <input
                    type="text"
                    id="sender"
                    placeholder="example@gmail.com"
                >
            </div>

            <div class="form-group">
                <label for="subject">Subject contains</label>
                <input
                    type="text"
                    id="subject"
                    placeholder="Example keyword"
                >
            </div>

            <div class="form-group">
                <label for="label">Gmail label</label>
                <input
                    type="text"
                    id="label"
                    placeholder="School"
                >
            </div>

            <div class="form-actions">
                <button id="saveRuleBtn" class="primary-btn">
                    Save Rule
                </button>

                <button id="cancelBtn" class="secondary-btn">
                    Cancel
                </button>
            </div>

        </section>

        <footer>
            <p>Gmail Auto-Labeler · Version 1.0</p>
        </footer>

    </div>

    <script src="popup.js"></script>

</body>
</html>
